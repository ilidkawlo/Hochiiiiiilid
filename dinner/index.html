<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今晚吃什麼｜晚餐登記與取餐</title>
<style>
  :root{
    --bg:#F6F0E5;
    --paper:#FFF9F0;
    --ink:#2F2A24;
    --red:#D85D49;
    --red-dark:#A94132;
    --mustard:#E6B655;
    --green:#7E9E7A;
    --green-soft:#E7EFE4;
    --line:#D8CDBE;
    --muted:#7F776D;
    --shadow:0 12px 30px rgba(72,56,37,.10);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(216,93,73,.05), transparent 24%),
      radial-gradient(circle at 88% 24%, rgba(230,182,85,.08), transparent 22%),
      var(--bg);
  }

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    margin-bottom:22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .logo{
    width:58px;height:58px;
    background:var(--red);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:30px;
    border-radius:22px 14px 24px 16px;
    transform:rotate(-2deg);
    box-shadow:var(--shadow);
  }

  .brand h1{
    margin:0;
    font-size:30px;
    letter-spacing:.5px;
  }

  .brand p{
    margin:3px 0 0;
    color:var(--muted);
    font-size:14px;
  }

  .owner-btn{
    border:none;
    background:#2F2A24;
    color:white;
    padding:12px 16px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
  }

  .hero{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:20px;
    margin-bottom:20px;
  }

  .card{
    background:var(--paper);
    border:1px solid rgba(216,205,190,.8);
    border-radius:24px 18px 28px 20px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }

  .paper-tab{
    position:absolute;
    width:90px;height:22px;
    background:#E9D8B9;
    top:8px;left:24px;
    transform:rotate(-3deg);
    opacity:.8;
  }

  .meal-card{
    padding:28px;
    min-height:290px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:800;
    color:var(--red-dark);
    background:#F9E1DB;
    border-radius:999px;
    padding:7px 11px;
  }

  .meal-title{
    font-size:34px;
    margin:18px 0 8px;
  }

  .meal-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    color:var(--muted);
    font-size:15px;
  }

  .meal-visual{
    margin-top:24px;
    height:120px;
    border-radius:24px 18px 26px 20px;
    background:
      linear-gradient(135deg,#EEC877 0 34%,#C86B4B 34% 56%,#75936F 56% 76%,#F3E2B8 76%);
    position:relative;
    overflow:hidden;
  }

  .meal-visual:before,
  .meal-visual:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:#FFF7E9;
    opacity:.85;
  }
  .meal-visual:before{width:150px;height:150px;right:38px;top:-16px}
  .meal-visual:after{width:72px;height:72px;right:78px;top:22px;background:#D87055}

  .order-card{
    padding:28px;
  }

  .section-title{
    margin:0 0 8px;
    font-size:23px;
  }

  .status-box{
    background:#FAF3E7;
    border:1px dashed #CDBDA8;
    padding:16px;
    border-radius:18px;
    margin:18px 0;
  }

  .progress-track{
    height:14px;
    border-radius:999px;
    background:#E6DDD1;
    overflow:hidden;
    margin:12px 0 8px;
  }

  .progress{
    height:100%;
    width:57%;
    background:var(--green);
    border-radius:999px;
    transition:.25s;
  }

  .big-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:18px 20px;
    font-size:22px;
    font-weight:900;
    cursor:pointer;
    background:var(--red);
    color:#fff;
    box-shadow:0 8px 0 #A94435;
    transition:.15s;
  }

  .big-btn:active{
    transform:translateY(4px);
    box-shadow:0 4px 0 #A94435;
  }

  .big-btn.secondary{
    background:var(--green);
    box-shadow:0 8px 0 #5E7A5B;
  }

  .grid{
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:20px;
  }

  .pickup-card,.summary-card{padding:26px}

  .pickup-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    margin-bottom:16px;
  }

  .people{
    display:grid;
    gap:10px;
  }

  .person{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    align-items:center;
    background:#FFFDF8;
    border:1px solid #E0D6C8;
    padding:14px;
    border-radius:16px;
  }

  .person strong{font-size:17px}

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:7px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
  }

  .paid{background:#E3F0E1;color:#466A42}
  .unpaid{background:#F8DFD8;color:#A14234}
  .picked{background:#EEE6D6;color:#6D604E}

  .mini-btn{
    border:none;
    background:#2F2A24;
    color:#fff;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    font-weight:800;
  }

  .mini-btn.done{
    background:#BDB3A6;
    cursor:default;
  }

  .summary-number{
    font-size:46px;
    font-weight:900;
    color:var(--red);
    margin:8px 0;
  }

  .kpis{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:16px;
  }

  .kpi{
    padding:14px;
    border-radius:16px;
    background:#F8F1E6;
  }

  .kpi span{
    display:block;
    color:var(--muted);
    font-size:13px;
  }

  .kpi strong{
    display:block;
    font-size:22px;
    margin-top:4px;
  }

  .notice{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
  }

  .modal{
    position:fixed;
    inset:0;
    background:rgba(32,28,24,.46);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:20;
  }

  .modal.show{display:flex}

  .modal-box{
    width:min(680px,100%);
    background:var(--paper);
    border-radius:24px;
    padding:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
  }

  .modal-top{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:center;
  }

  .close{
    border:none;
    background:#E9DFD0;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    font-weight:800;
  }

  .owner-list{
    display:grid;
    gap:10px;
    margin-top:16px;
  }

  .owner-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    padding:13px 14px;
    border-radius:14px;
    background:#FFFDF8;
    border:1px solid #E0D6C8;
  }

  @media (max-width:860px){
    .hero,.grid{grid-template-columns:1fr}
    .topbar{align-items:flex-start}
  }

  @media (max-width:620px){
    .app{padding:16px}
    .brand h1{font-size:24px}
    .person{grid-template-columns:1fr auto}
    .person .badge{grid-column:1/2}
    .person .mini-btn{grid-column:2/3;grid-row:1/3}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🍚</div>
        <div>
          <h1>今晚吃什麼</h1>
          <p>晚餐登記・取餐・付款，一頁完成</p>
        </div>
      </div>
      <button class="owner-btn" onclick="openOwner()">店主查看</button>
    </div>

    <section class="hero">
      <article class="card meal-card">
        <div class="paper-tab"></div>
        <div class="eyebrow">明日晚餐</div>
        <h2 class="meal-title">番茄燉雞腿＋烤時蔬</h2>
        <div class="meal-meta">
          <span>每份 NT$150</span>
          <span>・</span>
          <span>晚間 6:30 取餐</span>
          <span>・</span>
          <span>今晚 9:00 截止</span>
        </div>
        <div class="meal-visual" aria-label="晚餐視覺示意"></div>
      </article>

      <article class="card order-card">
        <h3 class="section-title">明天要一起吃嗎？</h3>
        <p style="margin:0;color:var(--muted)">至少 <strong>6 人</strong>才開火。現在已有 <strong id="count">4</strong> 人。</p>

        <div class="status-box">
          <div style="display:flex;justify-content:space-between;gap:12px;">
            <strong id="groupText">還差 2 人成團</strong>
            <span id="deadlineText">今晚 9:00 截止</span>
          </div>
          <div class="progress-track">
            <div class="progress" id="progress"></div>
          </div>
          <div style="font-size:13px;color:var(--muted)">成團進度</div>
        </div>

        <button class="big-btn" id="orderBtn" onclick="placeOrder()">我要一份</button>
        <div class="notice" id="orderNote">按一次就完成登記，不需要填表。</div>
      </article>
    </section>

    <section class="grid">
      <article class="card pickup-card">
        <div class="pickup-header">
          <div>
            <div class="eyebrow" style="background:#E6EFE2;color:#4F704B">今日取餐</div>
            <h3 class="section-title" style="margin-top:12px">找到自己的名字，按「我已取餐」</h3>
          </div>
          <span style="color:var(--muted);font-size:14px">讓廚師不用邊煮邊記</span>
        </div>

        <div class="people" id="peopleList"></div>
      </article>

      <aside class="card summary-card">
        <div class="eyebrow" style="background:#F4E7C6;color:#7A5B1B">今日摘要</div>
        <div class="summary-number" id="pickedCount">2 / 5</div>
        <div style="color:var(--muted)">已取餐人數</div>

        <div class="kpis">
          <div class="kpi">
            <span>已付款</span>
            <strong id="paidCount">3</strong>
          </div>
          <div class="kpi">
            <span>未付款</span>
            <strong id="unpaidCount">2</strong>
          </div>
        </div>

        <div class="notice">
          取餐與付款是兩個不同狀態。即使「已取餐但未付款」，店主晚點仍能查到。
        </div>
      </aside>
    </section>
  </div>

  <div class="modal" id="ownerModal">
    <div class="modal-box">
      <div class="modal-top">
        <div>
          <div class="eyebrow">店主模式</div>
          <h3 style="margin:10px 0 0;font-size:26px">今日未結清</h3>
        </div>
        <button class="close" onclick="closeOwner()">關閉</button>
      </div>
      <div class="owner-list" id="ownerList"></div>
    </div>
  </div>

<script>
let ordered = false;
let tomorrowCount = 4;
const minGroup = 6;

let people = [
  {name:"以莉", paid:true, picked:true},
  {name:"小安", paid:false, picked:true},
  {name:"怡君", paid:true, picked:false},
  {name:"阿哲", paid:false, picked:false},
  {name:"Mina", paid:true, picked:false}
];

function renderTomorrow(){
  document.getElementById("count").textContent = tomorrowCount;
  const progress = Math.min(100, tomorrowCount/minGroup*100);
  document.getElementById("progress").style.width = progress + "%";

  const groupText = document.getElementById("groupText");
  if(tomorrowCount >= minGroup){
    groupText.textContent = "已成團，明天會開火";
    groupText.style.color = "#466A42";
  }else{
    groupText.textContent = `還差 ${minGroup-tomorrowCount} 人成團`;
    groupText.style.color = "";
  }
}

function placeOrder(){
  if(ordered) return;
  ordered = true;
  tomorrowCount++;
  renderTomorrow();

  const btn = document.getElementById("orderBtn");
  btn.textContent = "✓ 已登記明日晚餐";
  btn.classList.add("secondary");
  document.getElementById("orderNote").textContent = "你已完成登記。若人數未達門檻，店主可再通知是否取消開火。";
}

function renderPeople(){
  const list = document.getElementById("peopleList");
  list.innerHTML = "";

  people.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "person";

    const name = document.createElement("strong");
    name.textContent = p.name;

    const badge = document.createElement("span");
    badge.className = "badge " + (p.paid ? "paid" : "unpaid");
    badge.textContent = p.paid ? "已付款" : "未付款";

    const btn = document.createElement("button");
    btn.className = "mini-btn" + (p.picked ? " done" : "");
    btn.textContent = p.picked ? "已取餐" : "我已取餐";
    btn.disabled = p.picked;
    btn.onclick = ()=>{
      people[i].picked = true;
      renderPeople();
    };

    row.appendChild(name);
    row.appendChild(badge);
    row.appendChild(btn);
    list.appendChild(row);
  });

  const picked = people.filter(p=>p.picked).length;
  const paid = people.filter(p=>p.paid).length;
  const unpaid = people.length-paid;
  document.getElementById("pickedCount").textContent = `${picked} / ${people.length}`;
  document.getElementById("paidCount").textContent = paid;
  document.getElementById("unpaidCount").textContent = unpaid;
}

function openOwner(){
  const ownerList = document.getElementById("ownerList");
  ownerList.innerHTML = "";

  const debtors = people.filter(p=>!p.paid);
  if(debtors.length===0){
    ownerList.innerHTML = "<div style='padding:18px;background:#E7EFE4;border-radius:14px'>今天全部都已付款。</div>";
  } else {
    debtors.forEach(p=>{
      const row = document.createElement("div");
      row.className = "owner-row";
      row.innerHTML = `<div><strong>${p.name}</strong><div style="font-size:13px;color:#7F776D;margin-top:4px">${p.picked ? "已取餐" : "尚未取餐"}</div></div><span class="badge unpaid">未付款 NT$150</span>`;
      ownerList.appendChild(row);
    });
  }

  document.getElementById("ownerModal").classList.add("show");
}

function closeOwner(){
  document.getElementById("ownerModal").classList.remove("show");
}

renderTomorrow();
renderPeople();
</script>
</body>
</html>
