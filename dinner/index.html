<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F0E5"><title>今晚吃什麼｜美味大愛光餐</title>
<style>
:root{--bg:#F6F0E5;--paper:#FFF9F0;--ink:#2F2A24;--muted:#7D756B;--red:#DC5C49;--red2:#B74434;--green:#789875;--green2:#557552;--line:#DED2C1;--soft:#F4EBDD;--shadow:0 10px 24px rgba(72,56,37,.09)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.app{width:min(100%,920px);margin:auto;padding:16px max(14px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:16px;background:var(--red);display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:22px}.sub,.helper,.small{color:var(--muted);line-height:1.5}.sub{font-size:12px}.helper{font-size:14px}.small{font-size:12px}.sync{font-size:12px;font-weight:800;color:var(--green2);background:#E7F0E3;border-radius:999px;padding:7px 10px}.quick-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 82%,transparent);padding:4px 0 12px}.nav-btn{border:1px solid var(--line);background:var(--paper);border-radius:18px;min-height:78px;padding:10px 7px;font:inherit;font-weight:900;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}.nav-btn span{display:block;font-size:24px;margin-bottom:4px}.nav-btn.active{background:#2F2A24;color:#fff;border-color:#2F2A24}.nav-btn.add.active{background:var(--red);border-color:var(--red)}.nav-btn.tomorrow.active{background:var(--green);border-color:var(--green)}.panel{display:none}.panel.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.hero-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.eyebrow{display:inline-flex;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:900;background:#E4EFE1;color:#4D6F49}.eyebrow.red{background:#F9DFD9;color:#A94335}.card h2{font-size:27px;margin:9px 0 5px}.stat{font-size:14px;font-weight:800;background:var(--soft);padding:9px 11px;border-radius:14px;white-space:nowrap}.people{display:grid;gap:10px}.person{border:1px solid var(--line);background:#FFFCF7;border-radius:18px;padding:14px}.person-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.person-name{font-size:20px;font-weight:900}.portion{font-size:13px;color:var(--muted);background:#F1E8DB;border-radius:999px;padding:7px 9px}.source-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}.source{font-size:11px;color:var(--muted)}.mini-delete{border:0;background:transparent;color:#A94335;font:inherit;font-size:12px;font-weight:900;padding:3px 2px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.state{min-height:54px;border:0;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}.unpaid{background:#F9DDD6;color:#A43E30}.paid{background:#DFEDDD;color:#40653E}.notpicked{background:#EDE7DE;color:#61584E}.picked{background:#2F2A24;color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.sum{border:2px solid transparent;padding:12px 6px;text-align:center;background:var(--soft);border-radius:14px;font:inherit;color:var(--ink);cursor:pointer}.sum strong{display:block;font-size:24px}.sum span{font-size:12px;color:var(--muted)}.sum.active{border-color:#2F2A24;background:#FFFDF9}.sum.active span{color:var(--ink);font-weight:900}.filter-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 2px 11px;font-size:14px;font-weight:900}.filter-title span{color:var(--muted);font-size:12px;font-weight:700}.field,.name-input{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px;font:inherit;font-size:18px;outline:0}.name-input:focus,.field:focus{border-color:var(--red)}.form-label{display:block;font-size:18px;font-weight:900;margin:18px 0 8px}.qty-box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 12px}.stepper{display:grid;grid-template-columns:50px 48px 50px;align-items:center;text-align:center}.step{height:50px;border:0;border-radius:14px;background:#EEE3D5;font-size:28px;font-weight:900}.qty{font-size:25px;font-weight:900}.cta{width:100%;border:0;border-radius:18px;padding:18px 14px;margin-top:14px;background:var(--red);color:#fff;font-weight:900;font-size:21px;box-shadow:0 7px 0 var(--red2)}.cta:active{transform:translateY(3px);box-shadow:0 4px 0 var(--red2)}.cta.green{background:var(--green);box-shadow:0 7px 0 var(--green2)}.progressBox{margin:14px 0;padding:15px;background:#FAF2E5;border:1px dashed #CDBCA5;border-radius:17px}.statusLine{display:flex;justify-content:space-between;gap:8px;font-weight:900}.track{height:13px;margin:10px 0 5px;background:#E7DDD0;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:999px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:13px}.empty{text-align:center;padding:28px 14px;background:#FAF2E5;border-radius:17px;color:var(--muted)}.cloud{margin-top:16px;padding:13px;background:#F0F6EE;border-radius:15px}.sync-btn{border:0;background:#2F2A24;color:#fff;border-radius:12px;padding:10px 12px;font-weight:900}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2F2A24;color:#fff;padding:11px 15px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.app{padding-top:24px}.people{grid-template-columns:1fr 1fr}.quick-nav{position:static}.nav-btn{min-height:88px;font-size:18px}.card{padding:24px}}@media(max-width:430px){.app{padding-left:11px;padding-right:11px}.brand .sub{display:none}.sync{display:none}.nav-btn{min-height:72px;font-size:14px;border-radius:16px}.nav-btn span{font-size:22px}.card{padding:16px}.card h2{font-size:24px}.hero-line{align-items:center}.stepper{grid-template-columns:46px 42px 46px}.step{height:46px}.state{min-height:56px}.sum strong{font-size:22px}}
</style></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">🍚</div><div><h1>今晚吃什麼</h1><div class="sub">今天取餐・臨時加餐・明天預訂</div></div></div><div id="syncTop" class="sync">● 雲端同步中</div></header>
<nav class="quick-nav" aria-label="主要功能"><button id="navToday" class="nav-btn active" onclick="showPanel('today')"><span>🍱</span>今日取餐</button><button id="navAdd" class="nav-btn add" onclick="showPanel('add')"><span>＋</span>今日臨時新增</button><button id="navTomorrow" class="nav-btn tomorrow" onclick="showPanel('tomorrow')"><span>📅</span>明日訂餐</button></nav>
<main>
<section id="panelToday" class="panel active"><div class="card"><div class="hero-line"><div><div class="eyebrow">今天</div><h2>誰來取餐？</h2></div><div id="todayStat" class="stat">0 份</div></div><div class="summary"><button id="filterAll" class="sum active" onclick="setTodayFilter('all')"><strong id="portionCount">0</strong><span>總份數</span></button><button id="filterPaid" class="sum" onclick="setTodayFilter('paid')"><strong id="paidCount">0</strong><span>已付款</span></button><button id="filterPicked" class="sum" onclick="setTodayFilter('picked')"><strong id="pickedCount">0</strong><span>已取餐</span></button></div><div class="filter-title"><div id="filterLabel">全部取餐名單</div><span>點上方數字切換</span></div><div id="peopleList" class="people"></div></div></section>
<section id="panelAdd" class="panel"><div class="card"><div class="eyebrow red">今天臨時加餐</div><h2>現在要加一份嗎？</h2><label class="form-label" for="adminName">請問芳名</label><input id="adminName" class="name-input" list="nameOptions" autocomplete="off" placeholder="點這裡選姓名，或輸入新名字"><datalist id="nameOptions"></datalist><label class="form-label">要幾份？</label><div class="qty-box"><div><strong>今日加餐份數</strong><div class="small">臨時新增會寫入晚餐系統</div></div><div class="stepper"><button class="step" onclick="changeAddQty(-1)">−</button><div id="addQty" class="qty">1</div><button class="step" onclick="changeAddQty(1)">＋</button></div></div><button id="addBtn" class="cta" onclick="adminAdd()">今日新增 1 份・NT$110</button></div></section>
<section id="panelTomorrow" class="panel"><div class="card"><div class="hero-line"><div><div class="eyebrow red">明日晚餐</div><h2>美味大愛光餐</h2><div class="helper"><strong>每份 NT$110</strong> ・ 晚間 6:00 取餐 ・ 今晚 9:00 截止</div></div><div id="tomorrowStat" class="stat">0 份</div></div><div class="progressBox"><div class="statusLine"><span id="groupText">還差 6 份成團</span><span>9:00 截止</span></div><div class="track"><div id="progress" class="bar"></div></div><div class="small">至少 6 份才開火。</div></div><label class="form-label" for="nameInput">請問芳名</label><input id="nameInput" class="name-input" list="nameOptions" autocomplete="off" placeholder="點這裡選姓名，或輸入新名字"><label class="form-label">要幾份？</label><div class="qty-box"><div><strong>明日訂餐份數</strong><div class="small">可一次幫家人或同事多訂</div></div><div class="stepper"><button class="step" onclick="changeQty(-1)">−</button><div id="qty" class="qty">1</div><button class="step" onclick="changeQty(1)">＋</button></div></div><button id="orderBtn" class="cta green" onclick="placeOrder()">明日登記 1 份・NT$110</button><div style="margin-top:20px"><strong>明日已登記</strong><div id="tomorrowChips" class="chips"></div></div></div></section>
</main><div class="cloud"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><strong>Google 試算表</strong><div id="cloudNote" class="small">正在同步資料</div></div><button class="sync-btn" onclick="loadCloud(true)">重新同步</button></div></div></div><div id="toast" class="toast"></div>
<script>
const PRICE=110,MIN_PORTIONS=6,API_URL='https://script.google.com/macros/s/AKfycbykzGOawROQT33yHfe9Ce58lapqyCMOj_WOssD6emHcoVcYnT3895heYallBq4KC44E/exec';let qty=1,addQty=1,todayPeople=[],tomorrowPeople=[],rosterNames=[],todayFilter='all';
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function todayISO(){return iso(new Date())}function tomorrowISO(){const d=new Date();d.setDate(d.getDate()+1);return iso(d)}
function showPanel(which){['today','add','tomorrow'].forEach(x=>{document.getElementById('panel'+cap(x)).classList.toggle('active',x===which);document.getElementById('nav'+cap(x)).classList.toggle('active',x===which)});window.scrollTo({top:0,behavior:'smooth'})}function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function setTodayFilter(filter){todayFilter=filter;['all','paid','picked'].forEach(x=>document.getElementById('filter'+cap(x)).classList.toggle('active',x===filter));renderTodayList()}
async function fetchDay(date){const r=await fetch(`${API_URL}?action=list&date=${encodeURIComponent(date)}&t=${Date.now()}`);const data=await r.json();if(!data.ok)throw new Error(data.error||'api');return data}async function apiPost(payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const data=await r.json();if(!data.ok)throw new Error(data.error||'api');return data}
async function loadCloud(showToast=false){const top=document.getElementById('syncTop'),note=document.getElementById('cloudNote');try{top.textContent='● 同步中';const [today,tomorrow]=await Promise.all([fetchDay(todayISO()),fetchDay(tomorrowISO())]);todayPeople=(today.people||[]).map(normalize);tomorrowPeople=(tomorrow.people||[]).map(normalize);rosterNames=[...new Set([...(tomorrow.names||[]),...(today.names||[])])];renderAll();top.textContent='● 已同步';note.textContent='月份月表＋晚餐系統已同步';if(showToast)toast('雲端同步完成')}catch(e){console.error(e);top.textContent='● 連線失敗';note.textContent='連線失敗，請稍後重新同步';if(showToast)toast('雲端連線失敗')}}function normalize(p){return {date:String(p.date||''),name:String(p.name||''),qty:Number(p.qty)||0,webQty:Number(p.webQty)||0,paid:Boolean(p.paid),picked:Boolean(p.picked),source:String(p.source||'')}}
function changeQty(d){qty=Math.max(1,Math.min(20,qty+d));document.getElementById('qty').textContent=qty;document.getElementById('orderBtn').textContent=`明日登記 ${qty} 份・NT$${qty*PRICE}`}function changeAddQty(d){addQty=Math.max(1,Math.min(20,addQty+d));document.getElementById('addQty').textContent=addQty;document.getElementById('addBtn').textContent=`今日新增 ${addQty} 份・NT$${addQty*PRICE}`}
async function placeOrder(){const input=document.getElementById('nameInput'),name=input.value.trim(),btn=document.getElementById('orderBtn');if(!name){input.focus();toast('請先選擇或輸入姓名');return}btn.disabled=true;try{await apiPost({action:'order',date:tomorrowISO(),name,qty,price:PRICE});input.value='';await loadCloud(false);toast(`${name} 明日已登記 ${qty} 份`);qty=1;changeQty(0)}catch(e){toast('登記失敗，請再試一次')}finally{btn.disabled=false}}
async function adminAdd(){const input=document.getElementById('adminName'),name=input.value.trim(),btn=document.getElementById('addBtn');if(!name){input.focus();toast('請先選擇或輸入姓名');return}btn.disabled=true;try{await apiPost({action:'order',date:todayISO(),name,qty:addQty,price:PRICE});input.value='';await loadCloud(false);toast(`${name} 今日新增 ${addQty} 份`);addQty=1;changeAddQty(0);setTodayFilter('all');showPanel('today')}catch(e){toast('新增失敗，請再試一次')}finally{btn.disabled=false}}
function renderAll(){document.getElementById('nameOptions').innerHTML=rosterNames.map(n=>`<option value="${esc(n)}"></option>`).join('');renderTomorrow();renderToday()}
function renderTomorrow(){const total=tomorrowPeople.reduce((s,p)=>s+p.qty,0);document.getElementById('tomorrowStat').textContent=total+' 份';document.getElementById('progress').style.width=Math.min(100,total/MIN_PORTIONS*100)+'%';document.getElementById('groupText').textContent=total>=MIN_PORTIONS?'已成團，明天會開火':`還差 ${MIN_PORTIONS-total} 份成團`;document.getElementById('tomorrowChips').innerHTML=tomorrowPeople.length?tomorrowPeople.map(p=>`<span class="chip">${esc(p.name)} ${p.qty}份</span>`).join(''):'<span class="small">目前尚未登記</span>'}
function renderToday(){const total=todayPeople.reduce((s,p)=>s+p.qty,0);document.getElementById('todayStat').textContent=total+' 份';document.getElementById('portionCount').textContent=total;document.getElementById('paidCount').textContent=todayPeople.filter(p=>p.paid).reduce((s,p)=>s+p.qty,0);document.getElementById('pickedCount').textContent=todayPeople.filter(p=>p.picked).reduce((s,p)=>s+p.qty,0);renderTodayList()}
function renderTodayList(){let rows=todayPeople;if(todayFilter==='paid')rows=todayPeople.filter(p=>p.paid);if(todayFilter==='picked')rows=todayPeople.filter(p=>p.picked);const labels={all:'全部取餐名單',paid:'已付款名單',picked:'已取餐名單'};document.getElementById('filterLabel').textContent=labels[todayFilter];document.getElementById('peopleList').innerHTML=rows.length?rows.map(p=>{const i=todayPeople.indexOf(p);return `<div class="person"><div class="person-top"><div><div class="person-name">${esc(p.name)}</div><div class="source-row"><span class="source">${esc(p.source||'雲端')}</span>${p.webQty>0?`<button class="mini-delete" onclick="deleteTemporary(${i})">刪除臨時加餐</button>`:''}</div></div><div class="portion">${p.qty} 份・NT$${p.qty*PRICE}</div></div><div class="state-grid"><button class="state ${p.paid?'paid':'unpaid'}" onclick="togglePaid(${i})">${p.paid?'✓ 已付款':'未付款'}</button><button class="state ${p.picked?'picked':'notpicked'}" onclick="togglePicked(${i})">${p.picked?'✓ 已取餐':'未取餐'}</button></div></div>`}).join(''):`<div class="empty">${todayFilter==='all'?'今天還沒有人登記晚餐':todayFilter==='paid'?'目前還沒有人完成付款':'目前還沒有人完成取餐'}</div>`}
async function deleteTemporary(i){const p=todayPeople[i];if(!p||p.webQty<=0)return;const msg=p.source==='月表＋網頁'?`刪除 ${p.name} 今天臨時新增的 ${p.webQty} 份？\n月表原本的 ${p.qty-p.webQty} 份會保留。`:`刪除 ${p.name} 今天臨時新增的 ${p.webQty} 份？`;if(!confirm(msg))return;try{await apiPost({action:'deleteOrder',date:todayISO(),name:p.name});await loadCloud(false);toast('臨時加餐已刪除並同步')}catch(e){toast('刪除失敗，請再試一次')}}
async function togglePaid(i){const p=todayPeople[i],old=p.paid;p.paid=!old;if(p.paid)successSound();else ohNoSound();renderToday();try{await apiPost({action:'status',date:todayISO(),name:p.name,paid:p.paid,picked:p.picked});await loadCloud(false)}catch(e){p.paid=old;renderToday();toast('付款狀態同步失敗')}}async function togglePicked(i){const p=todayPeople[i],old=p.picked;p.picked=!old;renderToday();try{await apiPost({action:'status',date:todayISO(),name:p.name,paid:p.paid,picked:p.picked});await loadCloud(false)}catch(e){p.picked=old;renderToday();toast('取餐狀態同步失敗')}}
function successSound(){try{const A=window.AudioContext||window.webkitAudioContext,ctx=new A(),now=ctx.currentTime;[[1046.5,0],[1568,.11]].forEach(([f,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(f,now+t);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.18,now+t+.008);g.gain.exponentialRampToValueAtTime(.0001,now+t+.11);o.connect(g).connect(ctx.destination);o.start(now+t);o.stop(now+t+.12)});setTimeout(()=>ctx.close(),500)}catch(e){}}function ohNoSound(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Oh no!');u.lang='en-US';u.rate=.9;u.pitch=.75;speechSynthesis.speak(u)}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1800)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}changeQty(0);changeAddQty(0);loadCloud(false);
</script></body></html>
