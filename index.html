<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和氣大愛職掌權責系統</title>
<style>
:root{--bg:#fbfbfb;--panel:#fff;--ink:#252525;--soft:#777;--line:#e7e7e7;--purple:#6d2b83;--cyan:#27d5cf;--sky:#7dddf2;--pink:#ee75ee;--yellow:#f5e77e;--danger:#d95d54;--danger-soft:#fff1ef}
*{box-sizing:border-box}body{margin:0;background:#fcfcfc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:300;line-height:1.75}.app{min-height:100vh}.sidebar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;padding:18px 5vw;background:rgba(252,252,252,.92);border-bottom:1px solid #eee;backdrop-filter:blur(18px)}.brand{min-width:220px}.brand .eyebrow{font-size:10px;letter-spacing:.2em;color:#999}.brand h1{margin:2px 0;color:var(--purple);font-size:18px;font-weight:500}.brand .sub{display:none}.navlist{list-style:none;padding:0;margin:0;display:flex;gap:4px;overflow:auto}.navlist li{margin:0}.navlist button{border:0;background:transparent;padding:10px 13px;border-radius:999px;white-space:nowrap;color:#333}.navlist button.active{background:#222;color:#fff}.navlist .count{font-size:10px;opacity:.65;margin-left:5px}.sidebar-foot{display:none}.main{position:relative;width:min(1440px,92vw);margin:auto;padding:70px 0 90px}.main:after{content:"";position:absolute;width:min(42vw,620px);aspect-ratio:1;right:4vw;top:70px;border:3px solid transparent;border-radius:47% 53% 50% 50%/44% 50% 50% 56%;background:linear-gradient(#fcfcfc,#fcfcfc) padding-box,linear-gradient(125deg,var(--cyan),var(--sky),var(--pink),var(--yellow),var(--cyan)) border-box;opacity:.62;transform:rotate(17deg);pointer-events:none}.topbar,#content{position:relative;z-index:2;width:min(720px,56%);margin-left:10%}.topbar{display:flex;gap:10px;margin-bottom:70px}.search{flex:1;min-width:0;padding:13px 17px;border:1px solid #ddd;border-radius:999px;background:#fff;font:inherit}.scanbtn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:12px 16px}.badge{display:inline-block;background:#222;color:#fff;border-radius:99px;padding:1px 7px;font-size:10px}.page-title{margin:0 0 12px;font-size:clamp(50px,6vw,90px);line-height:1.05;font-weight:300;letter-spacing:-.05em}.page-desc{margin:0 0 46px;color:#777;font-size:18px}.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ov-card,.card,.conflict-summary{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:20px}.ov-card{min-height:140px;cursor:pointer}.ov-card h3{margin:0 0 16px;font-size:18px;font-weight:500}.ov-card p{color:#888;font-size:12px}.group{margin-bottom:36px}.group h2{font-size:13px;font-weight:500;color:#555;border-bottom:1px solid #e7e7e7;padding-bottom:9px}.card{margin-bottom:10px}.card-top{display:flex;justify-content:space-between;gap:14px}.card-item{margin:0 0 5px;font-weight:500}.card-content{margin:0;color:#777;font-size:13px}.card.conflict{border-color:#efcecb}.warn-flag{border:0;border-radius:999px;padding:6px 9px;background:var(--danger-soft);color:var(--danger);white-space:nowrap}.tiers{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tier{font-size:10px;background:#f4f4f4;color:#666;border-radius:99px;padding:3px 8px}.conflict-summary{margin-bottom:12px;border-color:#efcecb}.conflict-summary h2{color:var(--danger);font-size:15px}.conflict-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #f1d9d7;font-size:12px}.tag{color:#a53d36;font-weight:500}.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(20,20,20,.42);backdrop-filter:blur(8px)}.overlay.show{display:grid}.modal{width:min(520px,100%);padding:28px;border-radius:26px;background:#fff}.modal-head{display:flex;align-items:center;gap:12px}.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--danger);color:#fff}.pair{margin:8px 0;padding:10px 12px;background:#f7f7f7;border-radius:12px;font-size:12px}.modal-actions{text-align:right;margin-top:16px}.modal-actions button{border:0;border-radius:99px;padding:10px 16px;background:#222;color:#fff}
@media(max-width:900px){.sidebar{flex-wrap:wrap}.brand{min-width:auto}.navlist{width:100%}.main{padding-top:40px}.main:after{width:60vw;right:-15vw;opacity:.25}.topbar,#content{width:100%;margin-left:0}.page-desc{max-width:82%}}
@media(max-width:600px){.main{width:100%;padding:30px 18px 70px}.topbar{display:grid;grid-template-columns:1fr auto;margin-bottom:45px}.page-title{font-size:clamp(44px,15vw,64px);max-width:85%}.page-desc{font-size:16px}.overview-grid{grid-template-columns:1fr}.ov-card{min-height:110px}.brand .eyebrow{display:none}}
</style>
</head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="eyebrow">和氣大愛文教基金會</div><h1>職掌權責系統</h1><div class="sub">七體分層負責明細</div></div><ul class="navlist" id="navlist"></ul><div class="sidebar-foot">重工警示</div></aside><main class="main"><div class="topbar"><input class="search" id="searchInput" placeholder="搜尋職掌關鍵字"><button class="scanbtn" id="scanBtn">衝突偵測 <span class="badge" id="scanBadge">0</span></button></div><div id="content"></div></main></div>
<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><div class="ico">!</div><h3>重工警示</h3></div><p id="modalDesc"></p><div id="modalPairs"></div><div class="modal-actions"><button id="modalClose">我知道了</button></div></div></div>
<script>
const BODIES=[
{id:'mentor',name:'導師體',icon:'◆',groups:[{group:'開班運作',items:[{item:'主班',content:'擔任主班、備課會議、班前五體系運作會議、課後檢討會議、班後檢討會議、主班視窗聯繫回報',level:['擬辦','審核','核定'],conflict:[]},{item:'班前體系運作',content:'各體系運作調度會議、檢核參班名單與同修身心愿現況、答覆體系及個人提問、軸線班前課程與教材內容討論確認',level:['擬辦','核定'],conflict:['名單類作業','課程教材內容']},{item:'班中體系運作',content:'現場與各工作負責人會議處理狀況、小區母團輪值招待新朋友、晨光下內場照看管理、課後eip紀錄收集回應',level:['擬辦','核定'],conflict:['班中現場照看']}]},{group:'生命進化靈性成長',items:[{item:'每天上eip關心同修紀錄',content:'蒐集週二晨光上下半場回應分享提問',level:['擬辦','核定'],conflict:['資料彙整回報']},{item:'引領關心生命進度',content:'點名到班率、體系定位引領、關心請假夥伴',level:['擬辦','審核','核定'],conflict:[]}]},{group:'法系',items:[{item:'全民法系',content:'定期申請逐字稿恭錄核聽、熟悉EIP法系工具箱',level:['擬辦','核定'],conflict:[]},{item:'參與開法庫流程作業',content:'參與學程教材整理製作',level:['擬辦','審核','核定'],conflict:['教材製作']}]}]},
{id:'facilitation',name:'玉成體',icon:'◇',groups:[{group:'班會執行',items:[{item:'報名註冊',content:'新學員註冊、區屬異動、名單掌握異動、名單統計分析、出席記錄與系統維護',level:[],conflict:['名單類作業']}]},{group:'課程規劃',items:[{item:'確立課程模式調性',content:'課程綱要、操作課程內容',level:['擬辦','審核','核定'],conflict:['課程教材內容']},{item:'課程行政～課中',content:'照看課程進行、課間備課、班中問題彙整、課程表調整、回饋表',level:['擬辦','覆核','核定'],conflict:['班中現場照看']}]},{group:'教材規劃製作',items:[{item:'PPT / 講義 / 教材清單',content:'主班團隊與中心擬辦教材產出',level:['覆核','核定'],conflict:['教材製作','教材規劃重疊']}]}]},
{id:'finance',name:'財務',icon:'◈',groups:[{group:'出納與會計',items:[{item:'審核請款文件',content:'依採購授權，初核覆核核定',level:['初核','覆核','核定'],conflict:[]},{item:'區財務任命與管理',content:'擬辦，總監覆核，董事長核定',level:['擬辦','覆核','核定'],conflict:['人事管理權責']}]},{group:'行政',items:[{item:'合約審核及用印',content:'初核，董事長核定，會辦出納會計',level:['初核','核定'],conflict:['採購合約']},{item:'課程公告財務事項審閱',content:'初核，總監覆核，董事長核定，會辦玉成體',level:['初核','覆核','核定'],conflict:['課程公告']}]}]},
{id:'service',name:'服務體',icon:'◐',groups:[{group:'接待引導組',items:[{item:'貴賓接待',content:'含邀請、贈送文宣禮品書籍CD準備',level:['擬辦','審核','核定'],conflict:['接待引導重疊']},{item:'操持服務人力招募',content:'服務人力招募事宜',level:['擬辦','審核','核定'],conflict:['人事管理權責']}]},{group:'總務',items:[{item:'物品採買（課程需求）',content:'會辦玉成組、財務組、各慈場傳光點',level:['擬辦','審核','核定'],conflict:['採購合約']}]}]},
{id:'guardian',name:'守護體',icon:'◑',groups:[{group:'導護',items:[{item:'史冊與作業標準書',content:'史冊建置、彙整作業標準書SOP',level:[],conflict:['史冊重複']}]},{group:'服務',items:[{item:'服務基本與客服',content:'環境膳食引導基本服務、客服',level:[],conflict:['接待引導重疊']}]},{group:'玉成',items:[{item:'守護職能課程教材',content:'守護職能課程、教材開發',level:[],conflict:['教材規劃重疊']}]},{group:'守護',items:[{item:'個案關懷',content:'個案關懷守護',level:[],conflict:['三方關懷']}]},{group:'法系',items:[{item:'日誌與史冊',content:'日誌記錄、史冊建置',level:[],conflict:['史冊重複']}]}]},
{id:'admin',name:'中心主管',icon:'●',groups:[{group:'基礎行政',items:[{item:'人員與分工管理',content:'行政中心同仁出缺勤管理，制定職責分工',level:[],conflict:['人事管理權責']}]},{group:'大型活動與盛典統籌',items:[{item:'現場與資源整合',content:'規劃典禮行政支援方案、場地動線、緊急應變機制',level:[],conflict:['接待引導重疊']}]},{group:'溝通管道建置與同修關懷',items:[{item:'申訴管道建置',content:'規劃同修及各部門專屬申訴反映管道',level:[],conflict:['三方關懷']}]}]}
];
const LABELS={'課程教材內容':'課程與教材內容方向容易兩體重複產出','教材製作':'PPT講義教材清單的實際製作與法系內容整理容易混淆','名單類作業':'參班名單、名冊統計與同修現況判斷容易重複建置','班中現場照看':'班會現場流程與個案關懷容易互相越界','資料彙整回報':'各體系資料彙整容易兩邊各做一份','課程公告':'課程公告與財務審閱容易搶先或漏審','採購合約':'物品採買與財務用印容易流程卡關','接待引導重疊':'貴賓與現場接待引導容易同時派工','教材規劃重疊':'教材製作容易各做各的版本','人事管理權責':'出缺勤、任命、招募等權責分散','三方關懷':'多個窗口皆有關懷職掌，容易重複或漏接','史冊重複':'同一體系內史冊項目重複'};
const idx={};BODIES.forEach(b=>b.groups.forEach(g=>g.items.forEach(it=>(it.conflict||[]).forEach(c=>(idx[c]??=[]).push({body:b.name,group:g.group,item:it.item})))));const keys=Object.keys(idx);let active='overview';const nav=document.getElementById('navlist'),content=document.getElementById('content');
function renderNav(){nav.innerHTML='';const all=document.createElement('li'),ab=document.createElement('button');ab.textContent='全部總覽';ab.className=active==='overview'?'active':'';ab.onclick=()=>{active='overview';render()};all.appendChild(ab);nav.appendChild(all);BODIES.forEach(b=>{const li=document.createElement('li'),bt=document.createElement('button');bt.className=active===b.id?'active':'';bt.innerHTML=`${b.icon} ${b.name}<span class="count">${b.groups.reduce((s,g)=>s+g.items.length,0)}</span>`;bt.onclick=()=>{active=b.id;render()};li.appendChild(bt);nav.appendChild(li)})}
function overview(){content.innerHTML=`<h1 class="page-title">改變<br>從清楚開始</h1><p class="page-desc">讓每一項職掌回到自己的位置。點選卡片查看完整內容，快速理解各體系的分工與重工警示。</p><div class="overview-grid">${BODIES.map(b=>`<div class="ov-card" onclick="go('${b.id}')"><h3>${b.icon} ${b.name}</h3><p>${b.groups.length} 大項 · ${b.groups.reduce((s,g)=>s+g.items.length,0)} 項職掌</p></div>`).join('')}</div>`}
function body(b){content.innerHTML=`<h1 class="page-title">${b.name}</h1><p class="page-desc">依分層負責明細呈現；淡紅框代表與其他體系存在重工疑慮。</p>`+b.groups.map(g=>`<div class="group"><h2>${g.group}</h2>${g.items.map(it=>`<div class="card ${(it.conflict||[]).length?'conflict':''}"><div class="card-top"><div><p class="card-item">${it.item}</p><p class="card-content">${it.content}</p></div>${(it.conflict||[]).length?`<button class="warn-flag" onclick='openModal(${JSON.stringify(it.conflict)})'>重工</button>`:''}</div>${it.level?.length?`<div class="tiers">${it.level.map(x=>`<span class="tier">${x}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`).join('')}
function render(){renderNav();active==='overview'?overview():body(BODIES.find(b=>b.id===active));document.getElementById('scanBadge').textContent=keys.length}function go(id){active=id;render();scrollTo({top:0,behavior:'smooth'})}
function openModal(labels){const k=labels[0];document.getElementById('modalDesc').textContent=LABELS[k]||'此職掌與其他體系內容重疊，建議對焦權責歸屬。';document.getElementById('modalPairs').innerHTML=(idx[k]||[]).map(e=>`<div class="pair"><b>${e.body}</b> · ${e.group} · ${e.item}</div>`).join('');document.getElementById('overlay').classList.add('show')}
document.getElementById('modalClose').onclick=()=>document.getElementById('overlay').classList.remove('show');document.getElementById('scanBtn').onclick=()=>{content.innerHTML=`<h1 class="page-title">衝突偵測</h1><p class="page-desc">目前找到 ${keys.length} 組可能重工或權責不清的項目。</p>`+keys.map(k=>`<div class="conflict-summary"><h2>${k}</h2><p>${LABELS[k]||''}</p>${idx[k].map(e=>`<div class="conflict-row"><span><span class="tag">${e.body}</span> ${e.group} · ${e.item}</span><span>›</span></div>`).join('')}</div>`).join('')};document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim();if(!q){render();return}let hits=[];BODIES.forEach(b=>b.groups.forEach(g=>g.items.forEach(it=>{if((it.item+it.content+g.group+b.name).includes(q))hits.push({b,g,it})})));content.innerHTML=`<h1 class="page-title">搜尋</h1><p class="page-desc">「${q}」找到 ${hits.length} 項結果</p>`+hits.map(x=>`<div class="group"><h2>${x.b.name} · ${x.g.group}</h2><div class="card"><p class="card-item">${x.it.item}</p><p class="card-content">${x.it.content}</p></div></div>`).join('')});render();
</script></body></html>
